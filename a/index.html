<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .hero {
            padding-top: 9px;
            padding-bottom: 22px;
        }

        .hero__container {
            max-width: 415px;
            margin: 0 auto;
            padding: 0 10px;
            position: relative;
        }

        .hero__top {
            background: linear-gradient(93.78deg, #0C6D00 0%, #17D300 128.37%);
            padding: 10px 20px 10px 21px;
            margin-bottom: 21px;
            max-width: 415px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero__top h1 {
            font-family: Inter, sans-serif;
            font-weight: 900;
            font-size: clamp(18.5px, 5.8vw, 23px);
            line-height: 140%;
            letter-spacing: 5%;
            text-transform: uppercase;
            color: white;
        }

        .hero__box {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hero__content h2 {
            font-family: "Atyp TEST", sans-serif;
            font-weight: 600;
            font-size: 16px;
            line-height: 130%;
            letter-spacing: 5%;
            margin-bottom: 16px;
        }

        .hero__info {
            display: flex;
            gap: 4px;
            margin-bottom: 48px;
        }

        .hero__info ul {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .hero__info ul li {
            font-family: "Atyp TEST", sans-serif;
            font-weight: 500;
            list-style: none;
            font-size: clamp(14.5px, 4.5vw, 16px);
            line-height: 130%;
            letter-spacing: 5%;
        }

        .hero__images-box {}

        .gradient {}

        .hero__btn {
            max-width: 324px;
            width: 100%;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background: linear-gradient(94.13deg, #16C700 13.8%, #14B300 55.11%, #119700 83%);
            box-shadow: 0px 4px 0px 0px #006103, 0px 2px 3px 1px #FFFFFF40 inset;
            padding: 33px 0 32px 0;
            margin-bottom: 40px;
            font-family: Inter, sans-serif;
            font-weight: 700;
            font-size: 24px;
            line-height: 100%;
            letter-spacing: 3%;
            text-transform: uppercase;
            color: white;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero__gift {
            display: flex;
            gap: 15px;
            transform: translateX(10px);
        }

        .hero__gift img {
            padding: 8px 6px 5px 7px;
            border-radius: 8px;
            background-color: white;
            border: 1px solid #16C600;
            box-shadow: 2px 2px 5.5px 0px #00FF1E40;
            margin-left: 20px;
            position: relative;
            z-index: 3;
        }

        .hero__gift p {
            font-family: "Atyp TEST", sans-serif;
            font-weight: 105;
            font-size: clamp(16px, 5vw, 18px);
            line-height: 120%;
            letter-spacing: 5%;
            padding: 8px 8px 8px 43px;
            border: 1px solid #108C00;
            border-radius: 9px;
            position: absolute;
            left: clamp(30px, 10vw, 50px);
            bottom: -23px;
        }

        .hero__gift p b {
            font-weight: 700;
        }

        @media (max-width:400px) {
            .hero__top {
                padding: 10px 10px 10px 21px;
            }

            .hero__gift img {
                margin-left: 0;
            }
        }

        @media (max-width:350px) {
            .hero__gift {
                transform: translateX(0);
            }
        }
    </style>
    <title>Zafar Xoliyorov</title>
    <link rel="stylesheet" href="./css/main.css" media="print" onload="this.media='all'" />
    <noscript>
        <link rel="stylesheet" href="./css/main.css" />
    </noscript>
</head>

<body>
    <main>
        <section class="hero">
            <div class="hero__top">
                <h1>Madrasalarga qanday <br>
                    qilib oson va tez <br>
                    kirish mumkin?</h1>
            </div>
            <div class="hero__container">

                <div class="hero__box">
                    <div class="hero__content">
                        <h2>Ushbu kanalda siz <br>
                            Bepulga:</h2>

                        <div class="hero__info">
                            <img src="./images/line.png" width="7" height="151" loading="lazy" decoding="async"
                                alt="line">

                            <ul>
                                <li>Madrasalarga kirish uchun <br>
                                    <b>bepul darsliklarni</b>
                                </li>
                                <li>Madrasaga <b>oson</b> va <b>tez <br>
                                        kirish</b> yo‘llarni</li>
                                <li><b>100+ talabalar</b> qo‘llagan <br>
                                    samarali metodlar</li>
                            </ul>
                        </div>
                    </div>

                    <div class="hero__images-box">
                        <img src="./images/speaker.avif" loading="lazy" decoding="async" width="161" height="301"
                            alt="speaker">
                        <div class="gradient"></div>
                    </div>
                </div>

                <button class="hero__btn">ro‘yxatdan o‘tish</button>

                <div class="hero__gift">
                    <img src="./images/gift.avif" loading="lazy" decoding="async" width="52" height="52" alt="gift">
                    <p>2 oylik madrasaga kirish <br>
                        darslarimiz <b>mutlaqo bepul</b></p>
                </div>
            </div>
        </section>
    </main>
